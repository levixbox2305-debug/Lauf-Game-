# Builds the web version and publishes it on GitHub Pages on every push to main.
name: Web-App veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Supabase-Variablen prüfen
        # Shows only whether the values exist, never the values themselves.
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SECRET_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          state() { if [ -n "$1" ]; then echo gesetzt; else echo FEHLT; fi; }
          echo "::notice title=Supabase::SUPABASE_URL $(state "$URL") · SUPABASE_ANON_KEY $(state "$KEY")"
          if [ -z "$URL" ] && [ -n "$SECRET_URL" ]; then
            echo "::warning title=Supabase::SUPABASE_URL ist als Secret angelegt – bitte unter Variables anlegen."
          fi
      - name: Build
        env:
          # Repository variables (Settings → Secrets and variables → Actions → Variables).
          # Without them the app runs fine, just without cloud backup.
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_BUILD_ID: ${{ github.sha }}
        # Project pages live under /<repo>; a <user>.github.io repo is served from the root.
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then export BASE_URL=""; else export BASE_URL="/$REPO"; fi
          npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
